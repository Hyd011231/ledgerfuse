name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说说场景，而不只是方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
  - type: markdown
    attributes:
      value: |
        提醒：本项目的底线是数据不出本机（可选的 AI 分析除外）。需要云端/账号体系的功能大概率不会做。
